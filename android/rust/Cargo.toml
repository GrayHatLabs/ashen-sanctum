# The game built as an Android native library (libmain.so) for SDL's Java side: the same source as the
# desktop and handheld builds (../../src), with SDL built from source as a shared library.
[package]
name = "ashensanctum-android"
version = "0.1.0"
edition = "2021"
build = "../../build.rs"

[lib]
name = "main"
path = "../../src/main.rs"
crate-type = ["cdylib"]

[dependencies]
sdl2 = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Inflates the embedded art (zlib-compressed by scripts/import_art.py; src/art.rs decode).
miniz_oxide = "0.8"
# Online play (the main Cargo.toml has the notes): TLS 1.3 with ring, the host's certificate, pinning, messages.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "crypto"] }
sha2 = "0.10"
postcard = { version = "1", default-features = false, features = ["use-std"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Unwind: online.rs catches a bad host's data instead of the game aborting.
panic = "unwind"
strip = true
