[package]
name = "ashensanctum"
version = "1.7.0"
edition = "2021"
description = "ASHEN SANCTUM - an isometric Diablo 2-style action RPG with a fire mage"

[dependencies]
sdl2 = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Inflates the embedded art (zlib-compressed by scripts/import_art.py; src/art.rs decode).
miniz_oxide = "0.8"
# Online play (docs/ONLINE_PLAN.md, src/net/): TLS 1.3 only, ring for the crypto; the host's own certificate;
# its fingerprint for trust-on-first-use; compact, bounded binary messages.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "crypto"] }
sha2 = "0.10"
postcard = { version = "1", default-features = false, features = ["use-std"] }
# The login server (src/server): passwords hashed with Argon2id.
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }

[build-dependencies]
# The Windows .exe's icon and version details (build.rs; only used when building for Windows).
winresource = "0.1"

[features]
# Build SDL2 from source and link it statically (needs CMake). Handy on Windows.
bundled = ["sdl2/bundled", "sdl2/static-link"]

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Unwind (not abort): a joiner survives a host sending something that can't be drawn (online.rs catches it).
panic = "unwind"
strip = true
