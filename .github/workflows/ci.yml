# Every push and pull request: the unit tests and the bot's self-test (headless, no window).
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: SDL2
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsdl2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: cargo test --release
      - name: Self-test (the bot plays a few minutes of Act 1)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          cargo build --release
          ./target/release/ashensanctum --selftest
